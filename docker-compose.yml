services:
  api:
    build: .
    environment:
      WORKER_ID: 1
      API_PORT: 8080
      DATABASE_URL: "postgres://blink:blink@postgres:5432/blink?sslmode=disable"
      TABLE_NAME: "urls"
      CACHE_URL: "redis:6379"
      CACHE_PASS: "blink"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: "blink"
      POSTGRES_PASSWORD: "blink"
      POSTGRES_DB: "blink"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blink"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "blink", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      - --maxmemory 256mb
      - --requirepass blink

volumes:
  postgres_data: